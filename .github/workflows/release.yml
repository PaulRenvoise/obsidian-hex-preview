name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to rebuild, verify, and attest
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          run_install: false

      - name: Verify release version and source
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = file => JSON.parse(readFileSync(file, 'utf8'));
          const manifest = read('manifest.json');
          assert.equal(manifest.version, process.env.RELEASE_TAG);
          assert.equal(read('package.json').version, manifest.version);
          assert.equal(read('versions.json')[manifest.version], manifest.minAppVersion);
          JS
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          # A manual backfill builds this workflow's source, not an unrecorded checkout.
          # Its build inputs must be identical to the original release tag.
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- \
            src tests styles.css manifest.json package.json pnpm-lock.yaml \
            pnpm-workspace.yaml tsconfig.json esbuild.config.mjs eslint.config.mjs versions.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, test, and build
        run: |
          pnpm lint
          pnpm test
          pnpm build

      - name: Upload release files
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/hex-preview/main.js
            dist/hex-preview/manifest.json
            dist/hex-preview/styles.css
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Keep repository code and dependency installation out of this privileged job.
      - name: Validate release inputs
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || exit 1

      - name: Download this run's release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/hex-preview
          merge-multiple: true
          digest-mismatch: error

      - name: Validate release files as data
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('dist/hex-preview')
          expected = {'main.js', 'manifest.json', 'styles.css'}
          if {path.name for path in root.iterdir()} != expected:
              raise SystemExit('Release must contain exactly the three Obsidian assets')
          for name in expected:
              path = root / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Invalid release asset: {name}')
          manifest = json.loads((root / 'manifest.json').read_text())
          if manifest.get('id') != 'hex-preview' or manifest.get('version') != os.environ['RELEASE_TAG']:
              raise SystemExit('Release manifest does not match the plugin and requested tag')
          PY

      - name: Verify existing release assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/released" \
            --pattern main.js --pattern manifest.json --pattern styles.css
          for asset in main.js manifest.json styles.css; do
            cmp "dist/hex-preview/$asset" "$RUNNER_TEMP/released/$asset"
          done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/hex-preview/main.js
            dist/hex-preview/manifest.json
            dist/hex-preview/styles.css

      - name: Publish new release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Hex Preview $RELEASE_TAG" --generate-notes \
            dist/hex-preview/main.js dist/hex-preview/manifest.json dist/hex-preview/styles.css
